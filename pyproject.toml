[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mlseal"
version = "0.1.0"
description = "Secure MLOps pipeline: data gates, safe model format, signed provenance and hardened serving for a phishing-website classifier."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Hugo" }]
keywords = ["mlops", "mlsecops", "supply-chain-security", "model-signing", "sbom", "phishing-detection"]
# Runtime dependencies only: this is everything the serving container installs.
# No scikit-learn, no pickle-based model library.
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.9",
    "cryptography>=44",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
train = ["scikit-learn>=1.6", "matplotlib>=3.9", "pyyaml>=6.0.2"]
dev = ["mlseal[train]", "pytest>=8.0", "pytest-cov>=5.0", "ruff==0.17.0", "httpx2>=2.10"]
audit = ["pip-audit>=2.9", "cyclonedx-bom>=7.0", "zizmor>=1.20"]

[project.scripts]
mlseal = "mlseal.cli:app"

[project.urls]
Repository = "https://github.com/hugo-kte/secure-mlops-pipeline"

[tool.hatch.build.targets.wheel]
packages = ["src/mlseal"]

[tool.uv]
# Dependency cooldown: ignore anything published in the two weeks before the lock was cut,
# so a freshly compromised release cannot slip in. Move the date forward deliberately.
exclude-newer = "2026-09-29T00:00:00Z"
# Reviewed exception: ruff is pinned portfolio-wide (dev-only tool, never shipped).
exclude-newer-package = { ruff = "2026-10-10T00:00:00Z" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# The portfolio's usual selection plus "S" (flake8-bandit): static security analysis runs
# with every lint.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S"]
ignore = [
    "N803", "N806",  # X/y naming is idiomatic in ML code
    "RUF001", "RUF002", "RUF003",  # intentional unicode in labels and docs
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, build throwaway passphrases and write harmless pickles for the scanner.
"tests/**" = ["S101", "S105", "S106", "S108", "S301", "S603", "S607"]

[tool.coverage.run]
source = ["mlseal"]
